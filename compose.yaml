# Vigilience - home infrastructure dashboard stack.
#
# Deploy ONLY through scripts/deploy.sh (or the equivalent documented command):
#   docker compose --project-name vigilience \
#     --env-file /home/linus/.config/vigilience/production.env -f compose.yaml up -d
#
# Design notes
# - State lives in Docker named volumes (under /var/lib/docker on the internal
#   SSD). The server's home directory is ecryptfs and is only mounted after
#   login, so bind-mounting state from it would break unattended reboots.
# - Nothing in this file touches Immich or the host-installed Plex.
# - No container gets `privileged`. Only the socket proxy mounts the Docker
#   socket, and it allows nothing but GET container list + stats.

name: vigilience

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:${HA_VERSION:-2026.10.2}
    container_name: vigilience-homeassistant
    # Host networking is what the official Linux container guide uses; it is
    # needed for LAN discovery and lets probes reach host-local services.
    network_mode: host
    environment:
      TZ: ${TZ:-America/Toronto}
      # Private, server-only values consumed by probe.sh (see .env.example).
      VIG_GATEWAY_HOST: ${VIG_GATEWAY_HOST:-}
      VIG_INTERNET_HOST_1: ${VIG_INTERNET_HOST_1:-1.1.1.1}
      VIG_INTERNET_HOST_2: ${VIG_INTERNET_HOST_2:-9.9.9.9}
      VIG_IMMICH_URL: ${VIG_IMMICH_URL:-}
      VIG_PLEX_URL: ${VIG_PLEX_URL:-}
      VIG_ROUTER_URL: ${VIG_ROUTER_URL:-}
      VIG_VPN_URL: ${VIG_VPN_URL:-}
      VIG_DOCKER_PROXY_PORT: ${DOCKER_PROXY_PORT:-2375}
    volumes:
      - ha_config:/config
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: 1536m
    logging: *logging
    depends_on:
      - glances
      - docker-proxy

  glances:
    image: nicolargo/glances:${GLANCES_VERSION:-4.5.8}
    container_name: vigilience-glances
    # Host network + host PID so CPU, memory, load, sensors and the Wi-Fi
    # interface reflect the HP server, not the container.
    network_mode: host
    pid: host
    environment:
      TZ: ${TZ:-America/Toronto}
      # REST API only, bound to loopback; Home Assistant reads it locally.
      # Glances gets no Docker access: its Docker client needs container
      # inspect, which exposes environment variables (secrets) of every
      # container. Container status comes from the allowlisted proxy instead.
      GLANCES_OPT: "-w --disable-webui -B 127.0.0.1 -p ${GLANCES_PORT:-61208} --disable-plugin containers"
    volumes:
      # Read-only view of the WD media drive. rslave lets an unmount on the
      # host propagate so "drive unmounted" is detected correctly.
      - type: bind
        source: ${MEDIA_MOUNT:-/mnt/media}
        target: /mnt/media
        read_only: true
        bind:
          propagation: ${MEDIA_PROPAGATION:-rslave}
      # Empty volume whose filesystem is the internal SSD (/var/lib/docker);
      # gives SSD capacity without exposing any host files.
      - ssd_probe:/mnt/ssd:ro
      - /etc/os-release:/etc/os-release:ro
    restart: unless-stopped
    mem_limit: 256m
    logging: *logging

  docker-proxy:
    image: wollomatic/socket-proxy:${SOCKET_PROXY_VERSION:-1.13.1}
    container_name: vigilience-docker-proxy
    # Listens on the server's loopback only and only accepts loopback clients.
    network_mode: host
    # Non-root; the docker group id is needed to read the socket.
    user: "65534:${DOCKER_GID:?set DOCKER_GID (getent group docker) in the env file}"
    command:
      - "-listenip=127.0.0.1"
      - "-proxyport=${DOCKER_PROXY_PORT:-2375}"
      - "-allowfrom=127.0.0.1/32"
      # Allowlist (anchored regex): container list and per-container stats.
      # Inspect, logs, export, archive, exec and every non-GET method are denied.
      - "-allowGET=(/v1\\.[0-9]{1,2})?/containers/(json|[0-9a-f]{12,64}/stats)"
      - "-watchdoginterval=300"
      - "-stoponwatchdog"
      - "-shutdowngracetime=5"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 32m
    logging: *logging

volumes:
  ha_config:
  ssd_probe:
